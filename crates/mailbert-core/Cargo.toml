[package]
name = "mailbert-core"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Core library for mailbert — mail storage, MIME pipeline, threading, and search"

[dependencies]
blake3 = "1"
chumsky = "0.13.0"
docbert-core = { path = "../docbert-core" }
heed = "0.22"
html2text = "0.17.1"
mail-parser = { version = "0.11.8", features = ["full_encoding"] }
miette = { version = "7.6.0", features = ["derive"] }
regex = "1"
rkyv = "0.8.17"
serde = { version = "1", features = ["derive"] }
tantivy = "0.26.1"
thiserror = "2"
toml = "1"
tracing = "0.1"
unicode-normalization = "0.1"

[dev-dependencies]
hegeltest = "0.28"
tempfile = "3"
