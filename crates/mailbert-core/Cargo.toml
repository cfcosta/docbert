[package]
name = "mailbert-core"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Core library for mailbert — mail storage, MIME pipeline, threading, and search"

[dependencies]
blake3 = "1"
chumsky = "0.13.0"
miette = { version = "7.6.0", features = ["derive"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
toml = "1"
unicode-normalization = "0.1"

[dev-dependencies]
hegeltest = "0.28"
