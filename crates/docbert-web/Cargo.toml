[package]
name = "docbert-web"
version = "0.10.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Web API server for docbert"

[dependencies]
docbert-core = { path = "../docbert-core" }
docbert-webui = { path = "../docbert-webui", optional = true }
axum = "0.8"
base64 = "0.22"
rand = "0.10"
reqwest = { version = "0.13.2", default-features = false, features = [
  "json",
  "form",
  "rustls",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tantivy = "0.26.0"
tokio = { version = "1", features = [
  "macros",
  "net",
  "rt-multi-thread",
  "time",
] }
tracing = "0.1"

[features]
default = ["webui"]
webui = ["dep:docbert-webui"]
mkl = ["docbert-core/mkl"]
accelerate = ["docbert-core/accelerate"]
metal = ["docbert-core/metal"]
cuda = ["docbert-core/cuda"]

[dev-dependencies]
pdf_oxide = "0.3.35"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
