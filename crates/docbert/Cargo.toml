[package]
name = "docbert"
version = "0.9.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "A powerful semantic search CLI for your documents"

[dependencies]
docbert-core = { path = "../docbert-core" }
docbert-web = { path = "../docbert-web" }
clap = { version = "4.6.1", features = ["derive"] }
clap_complete = "4.6"
globset = "0.4"
kdam = { version = "0.6.4", features = ["spinner", "template"] }
percent-encoding = "2"
rand = "0.10"
rmcp = { version = "1.5.0", features = ["transport-io"] }
schemars = "1.2.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tantivy = "0.26.0"
tokio = { version = "1", features = [
  "io-std",
  "macros",
  "net",
  "rt-multi-thread",
  "time",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
xdg = "3.0.0"

[features]
default = []
mkl = ["docbert-core/mkl", "docbert-web/mkl"]
accelerate = ["docbert-core/accelerate", "docbert-web/accelerate"]
metal = ["docbert-core/metal", "docbert-web/metal"]
cuda = ["docbert-core/cuda", "docbert-web/cuda"]

[dev-dependencies]
hegeltest = "0.10"
pdf_oxide = "0.3.35"
rmcp = { version = "1.5.0", features = ["client", "transport-child-process"] }
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[[test]]
name = "cli_smoke"
path = "../../tests/cli_smoke.rs"

[[test]]
name = "mcp_stdio"
path = "../../tests/mcp_stdio.rs"

[[test]]
name = "web_smoke"
path = "../../tests/web_smoke.rs"
