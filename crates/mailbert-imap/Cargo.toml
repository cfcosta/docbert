[package]
name = "mailbert-imap"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "IMAP client for mailbert — parallel fetch, incremental sync, and a fake server for tests"

[dependencies]
mailbert-core = { path = "../mailbert-core" }
rustls = { version = "0.23", default-features = false, features = [
  "ring",
  "std",
  "tls12",
] }
rustls-pki-types = "1"
thiserror = "2"
tokio = { version = "1", features = [
  "io-util",
  "macros",
  "net",
  "rt-multi-thread",
  "sync",
  "time",
] }
tokio-rustls = { version = "0.26", default-features = false, features = [
  "ring",
  "tls12",
] }
tracing = "0.1"
webpki-roots = "1"

[dev-dependencies]
hegeltest = "0.28"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
