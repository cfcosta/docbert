[package]
name = "docbert-core"
version = "0.10.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Core library for docbert semantic document search"

[dependencies]
blake3 = "1.8.5"
bytemuck = { version = "1.25.1", features = ["derive"] }
candle-core = "0.11.0"
docbert-plaid = { path = "../docbert-plaid" }
half = "2.7"
heed = "0.22"
ignore = "0.4"
docbert-pylate = { path = "../docbert-pylate" }
kodama = "0.3"
rayon = "1.12.0"
rkyv = "0.8.17"
pdf_oxide = "0.3.74"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tantivy = "0.26.1"
thiserror = "2"
tracing = "0.1"

[features]
default = []
mkl = ["docbert-pylate/mkl"]
accelerate = ["docbert-pylate/accelerate"]
metal = ["docbert-pylate/metal"]
# `cuda` propagates to both docbert-pylate (model inference on GPU) and
# docbert-plaid (k-means + MaxSim matmul on GPU).
cuda = ["docbert-pylate/cuda", "docbert-plaid/cuda"]

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
hegeltest = "0.28"
rand = "0.10"
tempfile = "3"

[[bench]]
name = "embedding_trim"
harness = false

[[bench]]
name = "embedding_compression"
harness = false
