[package]
name = "mailbert"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Hybrid search for your mail — the mailbert command line tool"

[dependencies]
clap = { version = "4.6.2", features = ["derive"] }
clap_complete = "4.6"
mailbert-core = { path = "../mailbert-core" }
mailbert-imap = { path = "../mailbert-imap" }
miette = { version = "7.6.0", features = ["fancy"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = [
  "io-std",
  "macros",
  "net",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }
xdg = "3.0.0"

[dev-dependencies]
hegeltest = "0.28"
tempfile = "3"
