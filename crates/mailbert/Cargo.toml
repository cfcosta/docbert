[package]
name = "mailbert"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Hybrid search for your mail — the mailbert command line tool"

[dependencies]
clap = { version = "4.6.2", features = ["derive"] }
candle-core = "0.11.0"
clap_complete = "4.6"
docbert-core = { path = "../docbert-core" }
docbert-plaid = { path = "../docbert-plaid" }
# The left side of a Message-ID. lettre already brings it in.
fastrand = "2"
jiff = "0.2"
lettre = { version = "0.11", default-features = false, features = [
  "builder",
  "hostname",
  "ring",
  "smtp-transport",
  "tokio1",
  "tokio1-rustls",
  "webpki-roots",
] }
mailbert-core = { path = "../mailbert-core" }
mailbert-imap = { path = "../mailbert-imap" }
miette = { version = "7.6.0", features = ["fancy"] }
regex = "1"
rmcp = { version = "2.2.0", features = ["transport-io"] }
schemars = "1.2.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syntect = { version = "5.3", default-features = false, features = [
  "default-fancy",
] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = [
  "io-std",
  "macros",
  "net",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }
xdg = "3.0.0"
sequoia-openpgp = { version = "2", default-features = false, features = [
  "crypto-rust",
  "allow-experimental-crypto",
  "allow-variable-time-crypto",
  "compression",
] }
sequoia-gpg-agent = { version = "0.6", default-features = false }

[features]
default = []
mkl = ["candle-core/mkl", "docbert-core/mkl"]
accelerate = ["candle-core/accelerate", "docbert-core/accelerate"]
metal = ["candle-core/metal", "docbert-core/metal"]
# `cuda` reaches the embedding model through docbert-core, and the
# k-means and MaxSim kernels of the PLAID index through docbert-plaid.
# It needs a CUDA toolkit at link time.
cuda = ["candle-core/cuda", "docbert-core/cuda", "docbert-plaid/cuda"]

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
hegeltest = "0.28"
tempfile = "3"

# The pipeline of §10.5. The bench measures the download, the index
# pass, and the plan of the model, against the fake server.
[[bench]]
name = "sync_pipeline"
harness = false
