[package]
name = "mailbert"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Hybrid search for your mail — the mailbert command line tool"

[dependencies]
clap = { version = "4.6.2", features = ["derive"] }
candle-core = "0.11.0"
clap_complete = "4.6"
docbert-core = { path = "../docbert-core" }
docbert-plaid = { path = "../docbert-plaid" }
jiff = "0.2"
mailbert-core = { path = "../mailbert-core" }
mailbert-imap = { path = "../mailbert-imap" }
miette = { version = "7.6.0", features = ["fancy"] }
regex = "1"
rmcp = { version = "2.2.0", features = ["transport-io"] }
schemars = "1.2.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syntect = { version = "5.3", default-features = false, features = [
  "default-fancy",
] }
thiserror = "2"
tokio = { version = "1", features = [
  "io-std",
  "macros",
  "net",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }
xdg = "3.0.0"

[dev-dependencies]
hegeltest = "0.28"
tempfile = "3"
