[toolchain]
# Stable; only rustfmt comes from a nightly, because rustfmt.toml's import
# options are nightly-only. The Nix flake pins it; elsewhere, format with
# `cargo +nightly-2026-08-04 fmt`.
channel = "1.100.0"
# `minimal` keeps the `default` profile's `rust-docs` (~0.7 GiB) and other
# doc artifacts out of the toolchain. The components we actually use for
# building and IDE support are listed back explicitly below.
profile = "minimal"
components = [
  "clippy",
  "llvm-tools-preview",
  "rust-analyzer",
  "rust-src",
  "rustfmt",
]
